# Discovery Question Bank
#
# Mirrors docs/handbook/discovery.md. Each question carries:
#   - id: stable slug
#   - type: 1 | 2 | 3 | 4 | 5 (per discovery.md typology)
#   - text_zh, text_en
#   - choices: list of {value, text_zh, text_en, axes: {axis_name: weight}}
#   - options: list of two {value, text_zh, text_en, axes} for Type-5 paired
#   - free_input: bool (always allowed for taste questions)
#   - free_input_only: bool (when true the question is text-only)
#   - multi_select: bool
#   - axes_influenced: list of axes this question moves
#   - source: handbook anchor or external citation
#
# Style axes (canonical, see _discovery.py AXES):
#   warmth · complexity · natural_vs_polished · contrast · aged_vs_new · symmetric_vs_organic
#
# Each axis range is [-1, 1]. Choice weights are summed and clamped per axis.

- version: 1
- last_updated: "2026-04-29"

# === Type 1 — Direct preference (hard constraints) ===

- id: q01_who_uses
  type: 1
  text_zh: "这个空间主要给谁用？"
  text_en: "Who uses this space most?"
  multi_select: true
  free_input: true
  choices:
    - {value: self_only, text_zh: "我自己", text_en: "Me only"}
    - {value: family, text_zh: "我和家人", text_en: "Me and family"}
    - {value: occasional_guests, text_zh: "我自己 + 偶尔朋友", text_en: "Me + occasional guests"}
    - {value: customers, text_zh: "经营给客人", text_en: "Customers / clients"}
    - {value: team, text_zh: "团队办公", text_en: "Team / office"}
  axes_influenced: []
  source: "discovery.md §Type-1"

- id: q02_project_type

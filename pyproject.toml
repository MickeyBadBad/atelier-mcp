[project]
name = "atelier-mcp"
version = "2.5.0+fork.1"
description = "Atelier — interior-design-focused MCP server for Blender. Handbook-grounded AI workflow (discovery questionnaire, citation-backed quality gates, procurement / BoM, moodboard, style-aware furniture). Compatible with Claude Desktop, Cursor, Codex, and any MCP client."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "BlenderMCP Fork Maintainers"},
    {name = "Siddharth Ahuja (original)"},
]
keywords = [
    "blender",
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-ai",
    "claude-code",
    "cursor",
    "ai-3d-modeling",
    "ai-3d",
    "blender-python",
    "blender-addon",
    "polyhaven",
    "sketchfab",
    "hyper3d",
    "rodin",
    "interior-design",
    "architectural-visualization",
    "pbr",
    "hdri",
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "pyyaml>=6.0.3",
    "supabase>=2.0.0",
    "tomli>=2.0.0",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
# Primary CLI: works without an MCP client (Pass A — Reach).
atelier = "atelier.cli:main"
# MCP server entry point (used by Claude / Cursor / etc.).
atelier-mcp = "atelier.server:main"
# Backward-compat alias so existing claude_desktop_config.json files
# pointing at `blender-mcp` keep working through the 2.4/2.5 transition.
blender-mcp = "atelier.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[project.urls]
"Homepage" = "https://github.com/MickeyBadBad/atelier-mcp"
"Bug Tracker" = "https://github.com/MickeyBadBad/atelier-mcp/issues"
"Changelog" = "https://github.com/MickeyBadBad/atelier-mcp/blob/develop/CHANGELOG.md"
"Upstream" = "https://github.com/ahujasid/blender-mcp"
